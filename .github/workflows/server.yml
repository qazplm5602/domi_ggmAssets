name: Server Deploy

on:
  push:
    tags:
      - 'server-v*'
  workflow_dispatch:

concurrency:
  group: server-deploy
  cancel-in-progress: false

env:
  PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
  REGISTRY: ${{ vars.REGISTRY_URL }}
  IMAGE_NAME: ggm-assets-backend

jobs:
  deploy:
    # 태그 외 브랜치는 제외함
    if: startsWith(github.ref, 'refs/tags/server-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # server-v0.0.1 → 0.0.1 변환
      - name: Version
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#server-v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            server/*.gradle*
            server/gradle/wrapper/gradle-wrapper.properties

      - name: Install
        run: |
          chmod +x ./gradlew
          ./gradlew dependencies

      - name: Build
        run: ./gradlew bootJar

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT || 22 }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host deploy
            HostName ${{ secrets.SSH_HOST }}
            Port ${{ secrets.SSH_PORT || 22 }}
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/id_deploy
          EOF

      # docker compose 전용 .env 변경
      - name: Write .env
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ssh deploy "echo 'IMAGE_TAG=$VERSION' > '$PROJECT_PATH/.env'"

      - name: Compose up
        run: |
          ssh deploy bash -s <<EOF
          set -euo pipefail
          cd "$PROJECT_PATH"
          docker compose pull
          docker compose up -d
          EOF
